<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="620" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="560" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">
    ARQUITETURA REAL DO PROJETO: AI TOOL ORCHESTRATOR
  </text>

  <!-- 1. USUÁRIO / FRONTEND -->
  <g filter="url(#softShadow)">
    <rect x="24" y="64" width="206" height="524" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="127" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">1. FRONTEND WEB</text>
    <text x="127" y="107" text-anchor="middle" font-size="10.5" fill="#475569">index.html + script.js</text>

    <rect x="40" y="124" width="174" height="86" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="127" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Usuário &amp; Prompt</text>
    <text x="127" y="166" text-anchor="middle" font-size="10" fill="#475569">Busca + Medidor de Clareza</text>
    <text x="127" y="182" text-anchor="middle" font-size="9.5" fill="#64748b">#agentSearchInput</text>
    <text x="127" y="198" text-anchor="middle" font-size="9.5" fill="#2563eb" font-weight="700">POST /api/orchestrate/stream</text>

    <rect x="40" y="228" width="174" height="96" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="127" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Visualizador Transformer</text>
    <text x="127" y="270" text-anchor="middle" font-size="10" fill="#475569">Fluxograma Sankey Q·K·V</text>
    <text x="127" y="286" text-anchor="middle" font-size="10" fill="#475569">Seletor Encoder / Decoder / MoE</text>
    <text x="127" y="302" text-anchor="middle" font-size="9.5" fill="#64748b">Jornada Tokens &amp; Embeddings</text>

    <rect x="40" y="342" width="174" height="104" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <text x="127" y="366" text-anchor="middle" font-size="12" font-weight="800" fill="#a16207">Observabilidade Local</text>
    <text x="127" y="384" text-anchor="middle" font-size="10" fill="#475569">Trace de Execução SSE</text>
    <text x="127" y="400" text-anchor="middle" font-size="10" fill="#475569">Comparador de Tokens (3 LLMs)</text>
    <text x="127" y="416" text-anchor="middle" font-size="9.5" fill="#64748b">Input / Tool Calling / Output</text>
    <text x="127" y="432" text-anchor="middle" font-size="9.5" fill="#a16207" font-weight="700">POST /api/compare-models</text>

    <rect x="40" y="464" width="174" height="104" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="127" y="488" text-anchor="middle" font-size="11.5" font-weight="800" fill="#047857">Resposta Fundamentada</text>
    <text x="127" y="506" text-anchor="middle" font-size="10" fill="#475569">Agente Jake Peralta + Cards</text>
    <text x="127" y="522" text-anchor="middle" font-size="10" fill="#475569">Fontes citadas + Links</text>
    <text x="127" y="542" text-anchor="middle" font-size="9.5" fill="#059669" font-weight="700">Stream SSE em tempo real</text>
  </g>

  <!-- 2. ORQUESTRAÇÃO & RACIOCÍNIO -->
  <g filter="url(#softShadow)">
    <rect x="268" y="64" width="490" height="312" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.8"/>
    <text x="513" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">2. ORQUESTRAÇÃO &amp; RACIOCÍNIO (BACKEND)</text>

    <!-- FastAPI -->
    <rect x="286" y="108" width="210" height="114" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="391" y="132" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1d4ed8">FastAPI + Python (:8001)</text>
    <text x="391" y="150" text-anchor="middle" font-size="10" fill="#475569">app/main.py + transformers.py</text>
    <text x="391" y="168" text-anchor="middle" font-size="9.8" fill="#334155">• /api/orchestrate/stream (SSE)</text>
    <text x="391" y="184" text-anchor="middle" font-size="9.8" fill="#334155">• /api/compare-models (3 LLMs)</text>
    <text x="391" y="200" text-anchor="middle" font-size="9.8" fill="#059669" font-weight="700">• Lifespan: Docker Auto-Start</text>

    <!-- LangChain Agent Loop -->
    <rect x="524" y="108" width="216" height="148" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="632" y="130" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6d28d9">LangChain Agent Loop</text>
    <text x="632" y="146" text-anchor="middle" font-size="9.8" fill="#64748b">app/services/orchestrator.py</text>
    <rect x="542" y="156" width="180" height="22" rx="5" fill="#ede9fe"/>
    <text x="632" y="171" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">1. Reasoning (System + Prompt)</text>
    <rect x="542" y="184" width="180" height="22" rx="5" fill="#ede9fe"/>
    <text x="632" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">2. Action (Tool Calling JSON)</text>
    <rect x="542" y="212" width="180" height="22" rx="5" fill="#ede9fe"/>
    <text x="632" y="227" text-anchor="middle" font-size="10" font-weight="700" fill="#5b21b6">3. Observe + Token Counter</text>
    <text x="632" y="248" text-anchor="middle" font-size="9" fill="#6d28d9">Contabiliza input/output/tool tokens</text>

    <!-- OpenRouter 3 LLMs -->
    <rect x="286" y="268" width="454" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
    <text x="513" y="290" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">Gateway OpenRouter — 3 Modelos Transformer</text>

    <rect x="298" y="302" width="136" height="44" rx="7" fill="#ffffff" stroke="#10b981" stroke-width="1.3"/>
    <text x="366" y="320" text-anchor="middle" font-size="10.2" font-weight="800" fill="#047857">openai/gpt-6.1-sol</text>
    <text x="366" y="336" text-anchor="middle" font-size="9" fill="#475569">Decoder + GQA</text>

    <rect x="445" y="302" width="142" height="44" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="516" y="320" text-anchor="middle" font-size="10.2" font-weight="800" fill="#1d4ed8">gemini-4-hydrogen</text>
    <text x="516" y="336" text-anchor="middle" font-size="9" fill="#475569">Multimodal Sparse MoE</text>

    <rect x="598" y="302" width="130" height="44" rx="7" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="663" y="320" text-anchor="middle" font-size="10.2" font-weight="800" fill="#6d28d9">kimi-k3.1-pro</text>
    <text x="663" y="336" text-anchor="middle" font-size="9" fill="#475569">Long-Context MoE</text>
  </g>

  <!-- 3. DADOS, RAG & BANCO DOCKER -->
  <g filter="url(#softShadow)">
    <rect x="268" y="402" width="490" height="186" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
    <text x="513" y="428" text-anchor="middle" font-size="13" font-weight="800" fill="#047857">3. DADOS PRIVADOS &amp; INFRA DOCKER (AUTO-START)</text>

    <rect x="286" y="446" width="222" height="122" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
    <text x="397" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">PostgreSQL + pgvector</text>
    <text x="397" y="488" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">Container Docker (:5432)</text>
    <text x="397" y="508" text-anchor="middle" font-size="9.5" fill="#475569">• compras_restaurante</text>
    <text x="397" y="524" text-anchor="middle" font-size="9.5" fill="#475569">• vendas + vetores pgvector</text>
    <text x="397" y="542" text-anchor="middle" font-size="9.2" fill="#64748b">Seed automático no boot</text>

    <rect x="526" y="446" width="214" height="122" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
    <text x="633" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Storage Local &amp; PDFs</text>
    <text x="633" y="488" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">storage/ + app/tools/files/</text>
    <text x="633" y="508" text-anchor="middle" font-size="9.5" fill="#475569">• ler_arquivo_storage (PDF/TXT)</text>
    <text x="633" y="524" text-anchor="middle" font-size="9.5" fill="#475569">• gerar_pdf_relatorio</text>
    <text x="633" y="542" text-anchor="middle" font-size="9.2" fill="#64748b">Extração direta sem mock</text>
  </g>

  <!-- 4. TOOLS EXTERNAS & WEB SEARCH -->
  <g filter="url(#softShadow)">
    <rect x="802" y="64" width="294" height="524" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8"/>
    <text x="949" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">4. FERRAMENTAS &amp; WEB REAL</text>
    <text x="949" y="107" text-anchor="middle" font-size="10.5" fill="#475569">app/tools/ (Tool Calling)</text>

    <rect x="820" y="126" width="258" height="158" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="949" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Web Search Multi-Fonte</text>
    <text x="949" y="168" text-anchor="middle" font-size="9.8" fill="#15803d" font-weight="700">web_search.py + ler_pagina_web</text>
    <text x="949" y="188" text-anchor="middle" font-size="9.8" fill="#334155">1. DuckDuckGo Lite (links diretos)</text>
    <text x="949" y="205" text-anchor="middle" font-size="9.8" fill="#334155">2. Bing News RSS + Google News</text>
    <text x="949" y="222" text-anchor="middle" font-size="9.8" fill="#334155">3. Wikipedia PT API</text>
    <text x="949" y="242" text-anchor="middle" font-size="9.5" fill="#1d4ed8" font-weight="700">Leitura de Máquina:</text>
    <text x="949" y="258" text-anchor="middle" font-size="9.3" fill="#475569">JSON-LD + Passagens + Jina Reader</text>

    <rect x="820" y="304" width="258" height="122" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="949" y="328" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Tools de Banco SQL</text>
    <text x="949" y="346" text-anchor="middle" font-size="9.8" fill="#15803d" font-weight="700">app/tools/database/</text>
    <text x="949" y="366" text-anchor="middle" font-size="9.8" fill="#334155">• consultar_compras_restaurante</text>
    <text x="949" y="384" text-anchor="middle" font-size="9.8" fill="#334155">• consultar_vendas</text>
    <text x="949" y="404" text-anchor="middle" font-size="9.3" fill="#64748b">Consultas SQL parametrizadas</text>

    <rect x="820" y="446" width="258" height="122" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <text x="949" y="470" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">APIs Externas &amp; Utilitários</text>
    <text x="949" y="488" text-anchor="middle" font-size="9.8" fill="#15803d" font-weight="700">app/tools/integrations/</text>
    <text x="949" y="508" text-anchor="middle" font-size="9.8" fill="#334155">• consultar_cep (ViaCEP)</text>
    <text x="949" y="526" text-anchor="middle" font-size="9.8" fill="#334155">• validar_cpf / cálculos</text>
    <text x="949" y="546" text-anchor="middle" font-size="9.3" fill="#64748b">Retorno determinístico ao LLM</text>
  </g>

  <!-- SETAS DE FLUXO -->
  <!-- Front -> FastAPI -->
  <path d="M 214 166 L 284 166" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <text x="249" y="157" text-anchor="middle" font-size="9.5" font-weight="800" fill="#1d4ed8">HTTP</text>

  <!-- FastAPI -> Front SSE -->
  <path d="M 284 205 L 245 205 L 245 495 L 216 495" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="249" y="346" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857" transform="rotate(-90 249 346)">SSE STREAM</text>

  <!-- FastAPI -> LangChain -->
  <path d="M 496 165 L 522 165" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrPurple)"/>

  <!-- LangChain <-> OpenRouter -->
  <path d="M 605 256 L 605 268" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrAmber)"/>
  <path d="M 655 268 L 655 258" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrPurple)"/>

  <!-- LangChain -> Tools Externas -->
  <path d="M 740 185 L 818 185" stroke="#059669" stroke-width="2.6" marker-end="url(#arrGreen)"/>
  <text x="779" y="176" text-anchor="middle" font-size="9.5" font-weight="800" fill="#047857">Tool Call</text>

  <!-- Tools -> LangChain (Observe) -->
  <path d="M 818 225 L 742 225" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrPurple)"/>
  <text x="779" y="241" text-anchor="middle" font-size="9.5" font-weight="800" fill="#6d28d9">Observe</text>

  <!-- Tools SQL <-> Docker PostgreSQL -->
  <path d="M 820 385 L 780 385 L 780 500 L 510 500" fill="none" stroke="#059669" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
</svg>
