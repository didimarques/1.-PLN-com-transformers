services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_orchestrator_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orchestrator -d ai_orchestrator
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
